name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python lint and tests
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ci-admin-key
      PLATFORM_MASTER_KEY: ci-platform-master-key
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: pip install -e "services/api[dev]"
      - name: Ruff
        run: python -m ruff check services/ libs/
      - name: Pytest
        run: python -m pytest tests -q

  webapp-quality:
    name: Webapp lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: services/webapp
        run: npm ci
      - name: Webapp lint
        working-directory: services/webapp
        run: npm run lint
      - name: Webapp build
        working-directory: services/webapp
        run: npm run build

  migrations:
    name: Migrations idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: betman
          POSTGRES_USER: betman
          POSTGRES_PASSWORD: betman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U betman -d betman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U betman && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432 -U betman
      - name: Apply migrations twice (idempotency check)
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: betman
          PGPASSWORD: betman
          PGDATABASE: betman
          ADMIN_API_KEY: ci-admin-key
          WEBAPP_READONLY_API_KEY: ci-webapp-readonly-key
          PLATFORM_MASTER_KEY: ci-platform-master-key
        run: |
          set -eu
          for run in 1 2; do
            echo "--- Migration run ${run} ---"
            sh scripts/migrate.sh
          done
      - name: Assert seed objects exist
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: betman
          PGPASSWORD: betman
          PGDATABASE: betman
        run: |
          set -eu
          admin_count=$(psql -tAc "SELECT count(*) FROM tenant_api_keys WHERE is_admin = true;")
          [ "${admin_count}" -ge 1 ] || { echo "Expected >= 1 admin key, got ${admin_count}"; exit 1; }
          migration_count=$(psql -tAc "SELECT count(*) FROM schema_migrations;")
          [ "${migration_count}" -ge 4 ] || { echo "Expected >= 4 schema_migrations rows, got ${migration_count}"; exit 1; }
          echo "Assertions passed: admin_keys=${admin_count}, migrations=${migration_count}"
