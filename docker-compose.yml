# docker-compose.yml — BETMAN_DATA local development stack
#
# Brings up the full BETMAN_DATA platform locally:
#   - PostgreSQL 16 with pgvector extension
#   - Redis 7 (live state + task queue)
#   - MinIO (S3-compatible object storage)
#   - BETMAN Data API  (http://localhost:8000)
#   - BETMAN Consumer  (nerve centre — HLS + race data + odds + weather)
#
# Usage:
#   docker compose up -d          # start everything
#   docker compose up -d postgres redis minio  # infrastructure only
#   docker compose logs -f api    # tail API logs
#   docker compose down -v        # full reset (removes volumes)

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/betman-media &&
        mc anonymous set download local/betman-media &&
        echo 'MinIO bucket ready.'
      "
    restart: "no"

  # ── Application services ─────────────────────────────────────────────────────

  migrate:
    image: python:3.11-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/migrations:/migrations
      - ./scripts:/scripts:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
      WEBAPP_READONLY_API_KEY: ${WEBAPP_READONLY_API_KEY:?set in .env}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:?set in .env}
      MIGRATION_DIR: /migrations
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache postgresql16-client >/dev/null 2>&1 && sh /scripts/migrate.sh
    restart: "no"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: ${REDIS_URL:?set in .env}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set in .env}
      CDN_BASE_URL: ${CDN_BASE_URL:?set in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: ./services/consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: ${REDIS_URL:?set in .env}
      QUEUE_URL: ${QUEUE_URL:?set in .env}
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:?set in .env}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:?set in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WEATHERLINK_BASE_URL: ${WEATHERLINK_BASE_URL:-https://api.weatherlink.com/v2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  webapp:
    build:
      context: ./services/webapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_PROXY_AUTHORIZATION: ${API_PROXY_AUTHORIZATION:?set in .env}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
