[project]
name = "betman-consumer"
version = "1.0.0"
description = "BETMAN Data Platform — Consumer Service (live data nerve centre)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
