[project]
name = "betman-scoring"
version = "0.1.0"
description = "BETMAN proprietary score calculation service"
requires-python = ">=3.11"

dependencies = [
    "asyncpg>=0.29",
    "redis[asyncio]>=5.0",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "xgboost>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
